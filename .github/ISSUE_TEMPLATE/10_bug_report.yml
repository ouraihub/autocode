name: Report a bug
description: Report a problem with autocode.
type: Bug
labels: "state:needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Search this repository's issues before opening a new report. Upvote an existing report with a :+1: reaction when it describes the same problem.

        Feature request? Use this repository's discussions if enabled, or open a blank issue describing your proposal.
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the bug from a **clean autocode build**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start autocode
        2. Click X
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current vs. Expected behavior
      description: |
        Current behavior (screenshots, videos, etc. are appreciated), vs. what you expected the behavior to be.

      placeholder: |
        Current behavior: <screenshot with an arrow> The icon is blue. Expected behavior: The icon should be red because this is what the setting is documented to do.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: autocode build and system specs
      description: |
        Open the command palette in autocode, then type “autocode: copy system specs into clipboard”. Include the source commit and build profile for local builds.
      placeholder: |
        autocode: <source commit>, <build profile>
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach autocode log file
      description: |
        Open the command palette in autocode, then type `autocode: open log` to see the last 1000 lines. Or type `autocode: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>autocode.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant autocode settings
      description: |
        Open the command palette in autocode, then type “autocode: open settings file” and copy/paste any relevant (e.g., LSP-specific) settings.

        ⚠️ **Please review your settings file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>settings.json</summary>

        <!-- Paste your settings inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant Keymap
      description: |
        Open the command palette in autocode, then type “autocode: open keymap file” and copy/paste the file’s contents.
      value: |
        <details><summary>keymap.json</summary>

        <!-- Paste your keymap file inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: dropdown
    attributes:
      label: If you are using WSL on Windows, what flavor of Linux are you using?
      multiple: false
      options:
        - Arch Linux
        - Ubuntu
        - Fedora
        - Mint
        - Pop!_OS
        - NixOS
        - Other
