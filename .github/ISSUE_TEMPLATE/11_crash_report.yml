name: Report a crash
description: autocode is crashing or freezing or hanging.
type: Crash
labels: "state:needs triage"
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean autocode build**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start autocode
        2. Perform an action
        3. autocode crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: autocode build and system specs
      description: |
        Open the command palette in autocode, then type “autocode: copy system specs into clipboard”. Include the source commit and build profile for local builds.
      placeholder: |
        autocode: <source commit>, <build profile>
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach autocode log file
      description: |
        Open the command palette in autocode, then type `autocode: open log` to see the last 1000 lines. Or type `autocode: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>autocode.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
