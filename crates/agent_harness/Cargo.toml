[package]
name = "agent_harness"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/agent_harness.rs"
doctest = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
i18n.workspace = true
indexmap.workspace = true
log.workspace = true
semver.workspace = true
model_provider.workspace = true
paths.workspace = true
reqwest.workspace = true
bytes.workspace = true
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
http-body-util = "0.1.3"
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing = { workspace = true, features = ["log"] }
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.5"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }
